<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pix - LK Variedades</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; padding: 24px; text-align: center; }
        .logo { font-size: 20px; font-weight: bold; color: #0d6efd; margin-bottom: 4px; }
        .sub { font-size: 13px; color: #6c757d; margin-bottom: 20px; }
        .qr-box { background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 8px; padding: 15px; display: inline-block; margin-bottom: 15px; }
        canvas { max-width: 180px; height: auto; }
        .pix-title { font-size: 13px; color: #495057; margin-bottom: 6px; font-weight: 600; }
        .pix-code { background: #e9ecef; border: 1px solid #ced4da; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; color: #212529; word-break: break-all; margin-bottom: 15px; }
        .btn { background-color: #198754; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; transition: 0.2s; }
        .btn:active { background-color: #146c43; }
        .footer-note { font-size: 12px; color: #8c959f; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🛍️ LK VARIEDADES</div>
    <div class="sub">Pagamento rápido via Pix</div>

    <div class="qr-box">
        <canvas id="qrcode"></canvas>
    </div>

    <div class="pix-title">Chave Pix (CPF):</div>
    <div class="pix-code" id="pixKey">84228130500</div>

    <button class="btn" onclick="copiarPix()">📋 Copiar Chave Pix</button>

    <div class="footer-note">
        Após realizar a transferência, envie o comprovativo no WhatsApp do suporte.
    </div>
</div>

<script>
    const pixKey = "84228130500";
    QRCode.toCanvas(document.getElementById('qrcode'), pixKey, { width: 180 }, function (error) {
        if (error) console.error(error);
    });

    function copiarPix() {
        navigator.clipboard.writeText(pixKey);
        alert("Chave Pix copiada para a área de transferência!");
    }
</script>

</body>
</html>
