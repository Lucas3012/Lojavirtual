<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Achadinhos LK</title>
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Overlay e Menu Lateral Estilo Vitrine -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Menu Achadinhos</h3>
      <button id="menu-close">&times;</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="/"><i class="fa-solid fa-house"></i> Vitrine Principal</a></li>
      <li><a href="/dashboard" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li><a href="/admin"><i class="fa-solid fa-gear"></i> Painel Admin</a></li>
    </ul>
  </aside>

  <!-- Cabeçalho -->
  <header class="admin-header">
    <button id="menu-toggle" aria-label="Abrir Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="admin-title">
      <i class="fa-solid fa-chart-line"></i> Dashboard
    </div>
  </header>

  <!-- Conteúdo -->
  <main style="padding: 20px;">
    <h2 style="font-size: 1.2rem; color: #333; margin-bottom: 15px;">📊 Métricas e Desempenho</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px;">
      <div style="background: #fff; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
        <h3 id="dash-total-produtos" style="font-size: 1.8rem; color: #ef4444;">0</h3>
        <p style="font-size: 0.85rem; color: #666;">Produtos</p>
      </div>
      <div style="background: #fff; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
        <h3 id="dash-total-categorias" style="font-size: 1.8rem; color: #3b82f6;">0</h3>
        <p style="font-size: 0.85rem; color: #666;">Categorias</p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.getElementById('menu-toggle');
      const menuClose = document.getElementById('menu-close');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      if (menuToggle && sidebar && overlay) {
        menuToggle.addEventListener('click', () => {
          sidebar.classList.add('open');
          overlay.classList.add('open');
        });

        const closeMenu = () => {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        };

        if (menuClose) menuClose.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
      }

      fetch('/api/produtos').then(r => r.json()).then(d => {
        document.getElementById('dash-total-produtos').innerText = d.length || 0;
      });
      fetch('/api/categorias').then(r => r.json()).then(d => {
        document.getElementById('dash-total-categorias').innerText = d.length || 0;
      });
    });
  </script>
</body>
</html>
