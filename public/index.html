<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achadinhos LK</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Topo -->
  <div class="shopee-top-bar">
    <i class="fa-solid fa-bars" id="menu-toggle"></i>
    <div class="shopee-search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Buscar no Achadinhos LK...">
    </div>
    <div class="top-icons-right">
      <a href="https://wa.me/5573981070937" target="_blank" style="text-decoration: none;"><i class="fa-brands fa-whatsapp"></i></a>
      <i class="fa-solid fa-share-nodes" onclick="compartilharProduto()"></i>
      <div class="badge-cart-shopee" onclick="abrirModalCheckout()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="count" id="cart-badge-count">0</span>
      </div>
    </div>
  </div>

  <!-- Menu Lateral -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Menu Achadinhos</span>
      <button id="menu-close" style="background:none; border:none; color:white; font-size:1.4rem; cursor:pointer;">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item">🏠 Vitrine Principal</a>
      <a href="/dashboard" class="nav-item">📊 Dashboard</a>
      <a href="/admin" class="nav-item">⚙️ Painel Admin</a>
    </nav>
  </aside>

  <!-- 1. SEÇÃO VITRINE (Página Inicial) -->
  <main class="vitrine-container" id="secao-vitrine">
    <div id="grid-produtos" style="display: contents;"></div>
  </main>

  <!-- 2. SEÇÃO DETALHES DO PRODUTO (Estilo Shopee) -->
  <div class="product-details-container" id="secao-detalhes">
    <div class="btn-voltar" onclick="voltarVitrine()"><i class="fa-solid fa-arrow-left"></i> Voltar para a vitrine</div>

    <div class="main-image-container">
      <img id="img-destaque" src="" alt="Produto">
    </div>

    <div class="price-section-shopee">
      <div class="price-pix">R$ <span id="preco-principal">0,00</span> <span>no Pix ></span></div>
      <div class="price-parcelado" id="preco-parcelado">Ou até 12x no cartão</div>
      <div class="vip-banner-shopee">
        <span><i class="fa-solid fa-crown"></i> Desconto exclusivo no checkout!</span>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </div>

    <div class="title-section-shopee">
      <span class="tag-indicado-shopee">Indicado</span>
      <span class="product-title-shopee" id="titulo-produto">Carregando...</span>
    </div>

    <div class="variations-section">
      <div class="var-title">Cor / Variação</div>
      <div class="var-thumbs" id="var-thumbs-container"></div>
    </div>
  </div>

  <!-- Barra Fixa Inferior (Apenas na página do produto) -->
  <div class="shopee-bottom-bar" id="barra-inferior">
    <a href="https://wa.me/5573981070937?text=Ol%C3%A1!" target="_blank" class="btn-action-chat">
      <i class="fa-regular fa-comments"></i>
      <span>Chat</span>
    </a>
    <button class="btn-action-cart" onclick="adicionarProdutoAtual()"><i class="fa-solid fa-cart-plus"></i></button>
    <button class="btn-action-buy" onclick="abrirModalCheckout()">Compre agora</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
